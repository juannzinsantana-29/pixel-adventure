<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Pixel Adventure</title>

            z-index: 2;

            left: 80px;

        .tree2 {

            overflow: hidden;
        }

        #player {
            width: 40px;
            height: 40px;
