<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Adventure</title>

    <style>
        body {
            margin: 0;
            background: #171717;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 900px;
            max-width: 95vw;
            height: 550px;
            max-height: 85vh;
            background: #6b8e23;
            border: 5px solid #222;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 40px;
            height: 40px;
            background: #4b7bec;
            border: 3px solid white;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        button {
            width: 55px;
            height: 55px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
        }

        button:active {
            background: #666;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="hud">
        ❤️ Vida: 100 &nbsp;&nbsp; ⭐ Moedas: 0
    </div>

    <div id="player"></div>

    <div id="controls">
        <button onclick="move(0, -20)">⬆️</button>
        <button onclick="move(-20, 0)">⬅️</button>
        <button onclick="move(20, 0)">➡️</button>
        <button onclick="move(0, 20)">⬇️</button>
    </div>

</div>

<script>
    const player = document.getElementById("player");
    const game = document.getElementById("game");

    let x = game.clientWidth / 2 - 20;
    let y = game.clientHeight / 2 - 20;

    function move(dx, dy) {

        x += dx;
        y += dy;

        x = Math.max(0, Math.min(game.clientWidth - 46, x));
        y = Math.max(0, Math.min(game.clientHeight - 46, y));

        player.style.left = x + "px";
        player.style.top = y + "px";
        player.style.transform = "none";
    }

    document.addEventListener("keydown", function(event) {

    const speed = 10;

    if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
        move(0, -speed);
    }

    if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
        move(0, speed);
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        move(-speed, 0);
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        move(speed, 0);
    }
});
</script>

</body>
</html>
